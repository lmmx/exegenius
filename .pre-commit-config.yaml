default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/lmmx/just-pre-commit
    rev: v0.6.6
    hooks:
      - id: run-just-rust
        alias: run-just-precommit
        name: just (lints)
        args: ['precommit']
        stages: [pre-commit]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
